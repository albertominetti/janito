name: Publish Docker image to GHCR

# Publishes ghcr.io/<owner>/janito on every release so the web UI can run
# as `docker run -p 9090:9090 ghcr.io/<owner>/janito:<tag>`.
# Triggers on version tags (v*, same as the PyPI release workflow) and on
# published GitHub releases. `docker-test-*` tags and manual dispatches
# publish clearly-marked throwaway tags (`test-<sha>` / `manual-<sha>`) so
# the pipeline can be verified without cutting a real release (they never
# touch `latest` or version tags).
on:
  push:
    tags:
      - 'v*'
      - 'docker-test-*'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push Docker image
    # Pinned instead of `ubuntu-latest`: the floating label migrates to
    # Ubuntu 26.04 starting 2026-10-19 (actions/runner-images#14748), and a
    # release/publish pipeline should not track a moving OS baseline.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=test-{{sha}},enable=${{ startsWith(github.ref, 'refs/tags/docker-test-') }}
            type=raw,value=manual-{{sha}},enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=janito
            org.opencontainers.image.description=Janito Web UI (janito --web) on port 9090

      - name: Resolve version for setuptools_scm
        id: version
        run: |
          # Tag is e.g. "v4.49.1" -> pretend version "4.49.1" (strip leading v).
          # Non-release refs (docker-test-*, manual runs) get a PEP 440
          # local version (0.0.0+test.<sha>) so the build stays valid.
          ref="${GITHUB_REF_NAME:-}"
          sha_short="${GITHUB_SHA::7}"
          if [[ "$ref" == v* ]]; then
            version="${ref#v}"
          elif [[ "$ref" == docker-test-* ]]; then
            version="0.0.0+test.${sha_short}"
          else
            version="0.0.0+manual.${sha_short}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
